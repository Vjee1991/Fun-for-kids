name: Fun for Kids website

on:
  push:
    branches: [main]
    paths:
      - 'fun-for-kids-site.zip.part-*'
      - '.github/workflows/fun-for-kids-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fun-for-kids-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble latest website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          parts=(fun-for-kids-site.zip.part-{01..04})
          for part in "${parts[@]}"; do
            test -s "$part" || { echo "::error::Missing file $part"; exit 1; }
          done
          cat "${parts[@]}" > /tmp/fun-for-kids-website.zip
          unzip -tq /tmp/fun-for-kids-website.zip
          unzip -q /tmp/fun-for-kids-website.zip -d _site
          test -s _site/index.html
          test -s _site/spel.html
          test -d _site/assets/image
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
        id: deploy
