name: Fun for Kids website

on:
  push:
    branches: [main]
    paths:
      - 'Fun-for-Kids-NIEUWE-WEBSITE.zip'
      - '.github/workflows/fun-for-kids-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fun-for-kids-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          unzip -tq Fun-for-Kids-NIEUWE-WEBSITE.zip
          unzip -q Fun-for-Kids-NIEUWE-WEBSITE.zip -d _site
          test -s _site/index.html
          cp Version.json _site/Version.json
          cp Fun-for-Kids-HTML-only-update.zip _site/Fun-for-Kids-HTML-only-update.zip
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
        id: deploy
