<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fun for Kids</title>
<style>html,body{margin:0;min-height:100%;background:#f8f0df;font-family:system-ui,sans-serif}main{display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px;box-sizing:border-box;color:#5a504a}</style>
</head>
<body>
<main id="loading" role="status">Fun for Kids wordt geladen…</main>
<script>
(async function () {
  try {
    const names = ['funforkids-index-part1.txt','funforkids-index-part2.txt'];
    const parts = [];
    for (const name of names) {
      const response = await fetch('./' + name, {cache:'no-cache'});
      if (!response.ok) throw new Error(name + ': HTTP ' + response.status);
      parts.push(await response.text());
    }
    document.open();
    document.write(parts.join(''));
    document.close();
  } catch (error) {
    document.getElementById('loading').textContent = 'De website kon niet geladen worden. Controleer of alle drie de bestanden in dezelfde map staan. (' + error.message + ')';
  }
})();
</script>
</body>
</html>
